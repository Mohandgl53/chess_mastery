version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: chesscoach_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-replace_with_secure_production_password}
      POSTGRES_DB: chesscoach
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chesscoach_user -d chesscoach"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://chesscoach_user:${DB_PASSWORD:-replace_with_secure_production_password}@postgres:5432/chesscoach
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-256410331325-2ckb0m93ekb1q13beblu9tn8cvj6p3t1.apps.googleusercontent.com}
      JWT_SECRET: ${JWT_SECRET:-chess_mastery_secure_jwt_secret_key_change_in_production_2026}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-256410331325-2ckb0m93ekb1q13beblu9tn8cvj6p3t1.apps.googleusercontent.com}
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend

volumes:
  postgres_data:
